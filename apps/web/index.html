<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Chạm Mây Đà Lạt — Multiplayer 3D Cloud Hunting World</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%231e2c48'/%3E%3Ccircle cx='38' cy='24' r='10' fill='%23ffb347'/%3E%3Cpath d='M10 44c8-6 18-6 26-1s14 3 18-1v10H10z' fill='%23f6efe4' opacity='.92'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Fraunces:ital,opsz,WONK,wght@0,9..144,0,400;0,9..144,0,600;1,9..144,0,400&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --dl-vh: 100vh;
      }
      @supports (height: 100dvh) {
        :root {
          --dl-vh: 100dvh;
        }
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
      }
      html,
      body,
      #root {
        width: 100%;
        height: 100vh;
        height: 100dvh;
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
        background: #141e30;
        font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif;
        color: #f8f3eb;
      }
      .dalat-full-viewport {
        width: 100%;
        height: 100vh;
        height: 100dvh;
      }
      input,
      textarea,
      select {
        user-select: text;
        -webkit-user-select: text;
        font-family: inherit;
      }
      @media (max-width: 860px), (pointer: coarse) {
        input,
        textarea,
        select {
          font-size: 16px !important;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
      [data-reduced-motion="true"] *,
      [data-reduced-motion="true"] *::before,
      [data-reduced-motion="true"] *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
